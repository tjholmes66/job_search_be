services:
  mysqldb:
    image: 'mysql:latest'
    container_name: mysql-db-ats
    environment:
      - 'MYSQL_DATABASE=job_search_db'
      - 'MYSQL_PASSWORD=passw0rd'
      - 'MYSQL_ROOT_PASSWORD=passw0rd'
      - 'MYSQL_USER=job_search_user'
    ports:
      - '33060:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
        test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
        timeout: 5s
        retries: 10
        interval: 5s

  spring-boot-app:
        build: .
        container_name: spring-app-container
        ports:
          - "8080:8080"
        depends_on:
          mysqldb:
            condition: service_healthy
        environment:
          # Use the docker service name (mysqldb) instead of localhost
          SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:33060/my_application_db?allowPublicKeyRetrieval=true&useSSL=false
          SPRING_DATASOURCE_USERNAME: job_search_user
          SPRING_DATASOURCE_PASSWORD: passw0rd

volumes:
  mysql-data: