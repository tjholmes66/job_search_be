# 1. Spring Boot - Hibernate6 settings
#spring.datasource.url=jdbc:mysql://127.0.0.1:3306/job_search_db?serverTimezone=UTC
spring.datasource.url=jdbc:mysql://localhost:3306/job_search_db?dontTrackSessionChanges=true&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=job_search_user
spring.datasource.password=passw0rd
spring.jpa.generate-ddl=false

# 2. Disable Hibernate Schema Manipulation (Crucial for existing data)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# 3. Flyway Baseline Configuration
spring.flyway.enabled=true
# Tells Flyway to create a metadata table if it doesn't exist
spring.flyway.baseline-on-migrate=true
# The version to label your existing database state (e.g., 0 or 1)
spring.flyway.baseline-version=1
# The description recorded for this baseline state
spring.flyway.baseline-description=Existing database baseline

# For Spring Security
#spring.security.user.name=admin
#spring.security.user.password=password

# For Flyway Maven Plugin
flyway.url=jdbc:mysql://localhost:3306/job_search_db?dontTrackSessionChanges=true&allowPublicKeyRetrieval=true&useSSL=false
flyway.user=job_search_user
flyway.password=passw0rd

# For ThymeLeaf and HTMX Pages
spring.thymeleaf.cache=false

# Registration Details (Replace 'my-keycloak-client' and 'your-client-secret')
spring.security.oauth2.client.registration.keycloak.provider=keycloak
spring.security.oauth2.client.registration.keycloak.client-id=job_search_client
spring.security.oauth2.client.registration.keycloak.client-secret=fATsjV8roXomG16FeaNSjAImhQj4sTjnaquoNXIPwqznKkXgUvkPT2TCYtrEMrS9CXPoPeKgiTHQ47FRfc6iMx
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code

# Tell Keycloak where to send the user back to (Spring's internal endpoint)
spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# Tell Spring Security where to send the user to login
spring.security.oauth2.client.provider.keycloak.authorization-uri=http://localhost:9000/realms/job_search_realm/protocol/openid-connect/auth
spring.security.oauth2.client.provider.keycloak.token-uri=http://localhost:9000/realms/job_search_realm/protocol/openid-connect/token

spring.security.oauth2.client.provider.keycloak.user-info-uri=http://localhost:9000/realms/job_search_realm/protocol/openid-connect/userinfo

# Provider Details (Replace with your Keycloak server host, port, and realm name)
spring.security.oauth2.client.provider.keycloak.issuer-uri=http://localhost:9000/realms/job_search_realm
spring.security.oauth2.client.provider.keycloak.user-name-attribute=preferred_username
