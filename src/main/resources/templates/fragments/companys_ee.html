<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <title>Company Management</title>

    <script th:src="@{/js/htmx.min.js}"></script>

    <style>
        body { font-family: sans-serif; margin: 40px; }
        .search-box { margin-bottom: 20px; padding: 8px; width: 250px; }
        ul { list-style: none; padding: 0; }
        li { padding: 8px; border-bottom: 1px solid #eee; width: 250px; }
    </style>
</head>
<body>

<h2>Companies Directory</h2>

<thead>
    <tr>
        <th>ID</th>
    </tr>
</thead>
<tbody th:fragment="company-list">
<!-- Iterate over each company -->
<tr th:each="company : ${companies}"
    th:id="'company-row-' + ${company.id}"
    hx-target="this"
    hx-swap="outerHTML">

    <td>
        <a th:text="${company.companyName}"
           th:href="@{/companies/{id}(id=${company.id})}"></a>
    </td>
    <td th:text="${company.companyCode}"></td>
    <td th:text="${company.description}"></td>
    <td th:text="${company.address1}"></td>

    <td>
        <!-- Edit button: HTMX swap-in an edit form row -->
        <button hx-get="@{/companies/{id}/edit(id=${company.id})}"
                class="btn btn-sm btn-outline-primary">
            Edit
        </button>

        <!-- Delete button: removes the row on success -->
        <button hx-delete="@{/companies/{id}(id=${company.id})}"
                hx-confirm="Delete this company?"
                class="btn btn-sm btn-outline-danger">
            Delete
        </button>
    </td>
</tr>

<!-- Empty state when list is empty -->
<tr>
    <td colspan="5" class="text-center text-muted"
        th:if="${#lists.isEmpty(companies)}">
        No companies found.
    </td>
</tr>
</tbody>

</body>
</html>
