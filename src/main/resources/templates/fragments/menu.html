<nav>
    <div class="menu-section">
    <!-- Outer Loop: Iterates through categories -->

    <br/></br>
    <div  th:each="category : ${menuItems}">

        <br/>
        <h2 style="margin-left: 50px; font-size: 1.5rem;"  th:text="${category.key}">Category Name</h2>

        <ul class="menu-list">
            <th:block th:each="item : ${category.value}">
                <li>
                    <button  style="margin-left: 50px;"
                             th:attr="hx-get=${item.url}"
                            hx-target="#main-content"
                            hx-swap="innerHTML"
                            th:text="${item.name}">
                        Menu Item
                    </button>

                </li>
            </th:block>
        </ul>

    </div>
    </div>
</nav>
